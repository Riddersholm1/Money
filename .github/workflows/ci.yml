name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # Coverage collection is deliberately absent, and this is the specific reason rather than a
      # shrug. Microsoft.Testing.Extensions.CodeCoverage 18.9.0 is compiled against an older
      # Microsoft.Testing.Platform than the 2.3.0 that xunit.v3 3.2.2 brings in, so registering it
      # throws before a single test runs:
      #
      #   System.TypeLoadException: Could not load type
      #   'Microsoft.Testing.Platform.Extensions.TestHost.IDataConsumer' from assembly
      #   'Microsoft.Testing.Platform, Version=2.3.0.0'
      #      at Microsoft.Testing.Platform.MSBuild.MSBuildExtensions.AddMSBuild
      #      at ...SelfRegisteredExtensions.AddSelfRegisteredExtensions
      #
      # It is a version incompatibility between the two packages, not a configuration mistake, so
      # there is nothing to fix on this side. Re-test after either package updates; a green suite is
      # worth more than a coverage number that requires pinning an old test framework to obtain.
      - name: Test
        run: dotnet test -c Release --no-build

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Directory.Build.props demotes NU1900-NU1904 to warnings so that a newly published advisory,
      # or an unreachable feed, does not break every developer's build for reasons outside this
      # repository. Shipping with a known-vulnerable dependency is a different matter, so this job
      # promotes them back to errors. -warnaserror is passed here rather than being the default
      # precisely so the failure lands in CI and not on someone's inner loop.
      - name: Restore with vulnerability findings as errors
        run: dotnet restore -warnaserror:NU1900,NU1901,NU1902,NU1903,NU1904

  aot:
    name: NativeAOT & trimming gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The project sets PublishAot and TrimMode=full itself. They must NOT be passed on the command
      # line: -p: creates a global property that would reach the netstandard2.0 generator, which
      # cannot be AOT-compiled. Any IL2xxx/IL3xxx warning fails the build (TreatWarningsAsErrors).
      - name: Publish AOT smoke test
        run: dotnet publish tests/Riddersholm.Money.AotTests -c Release -r linux-x64

      # Exits non-zero if any assertion fails, so a trimmed-away code path is caught at runtime too.
      - name: Run native binary
        run: ./artifacts/publish/Riddersholm.Money.AotTests/release_linux-x64/Riddersholm.Money.AotTests

  pack:
    name: Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack -c Release -o ./artifacts/nuget

      # The README and docs/architecture.md both promise "no dependencies", and the core project
      # references the generator as an analyzer. ReferenceOutputAssembly="false" suppresses the
      # compile-time reference but not the package dependency; only PrivateAssets="all" does that, and
      # nothing in the build asserted it. This step is the assertion.
      - name: Verify the core package declares no dependencies
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Matched explicitly rather than with a wildcard on the whole name: Riddersholm.Money.* would
          # also pick up Riddersholm.Money.EntityFrameworkCore, which legitimately has dependencies.
          packages=(artifacts/nuget/Riddersholm.Money.[0-9]*.nupkg)
          if [ ${#packages[@]} -ne 1 ]; then
            echo "::error::Expected exactly one core package, found ${#packages[@]}: ${packages[*]-none}"
            exit 1
          fi
          echo "Inspecting ${packages[0]}"
          unzip -p "${packages[0]}" Riddersholm.Money.nuspec > core.nuspec
          cat core.nuspec
          if grep -q '<dependency ' core.nuspec; then
            echo "::error::Riddersholm.Money declares package dependencies; the README says it has none."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/nuget/*.*nupkg
          if-no-files-found: error
