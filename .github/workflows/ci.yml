name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # Coverage collection is deliberately absent. Microsoft.Testing.Extensions.CodeCoverage does not
      # currently load under this xUnit v3 / Microsoft.Testing.Platform host — it fails at
      # AddSelfRegisteredExtensions before any test runs — and a green suite is worth more than a
      # coverage number. Revisit when the extension supports this host.
      - name: Test
        run: dotnet test -c Release --no-build

  aot:
    name: NativeAOT & trimming gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The project sets PublishAot and TrimMode=full itself. They must NOT be passed on the command
      # line: -p: creates a global property that would reach the netstandard2.0 generator, which
      # cannot be AOT-compiled. Any IL2xxx/IL3xxx warning fails the build (TreatWarningsAsErrors).
      - name: Publish AOT smoke test
        run: dotnet publish tests/Riddersholm.Money.AotTests -c Release -r linux-x64

      # Exits non-zero if any assertion fails, so a trimmed-away code path is caught at runtime too.
      - name: Run native binary
        run: ./artifacts/publish/Riddersholm.Money.AotTests/release_linux-x64/Riddersholm.Money.AotTests

  pack:
    name: Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack -c Release -o ./artifacts/nuget

      # The README and docs/architecture.md both promise "no dependencies", and the core project
      # references the generator as an analyzer. ReferenceOutputAssembly="false" suppresses the
      # compile-time reference but not the package dependency; only PrivateAssets="all" does that, and
      # nothing in the build asserted it. This step is the assertion.
      - name: Verify the core package declares no dependencies
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Matched explicitly rather than with a wildcard on the whole name: Riddersholm.Money.* would
          # also pick up Riddersholm.Money.EntityFrameworkCore, which legitimately has dependencies.
          packages=(artifacts/nuget/Riddersholm.Money.[0-9]*.nupkg)
          if [ ${#packages[@]} -ne 1 ]; then
            echo "::error::Expected exactly one core package, found ${#packages[@]}: ${packages[*]-none}"
            exit 1
          fi
          echo "Inspecting ${packages[0]}"
          unzip -p "${packages[0]}" Riddersholm.Money.nuspec > core.nuspec
          cat core.nuspec
          if grep -q '<dependency ' core.nuspec; then
            echo "::error::Riddersholm.Money declares package dependencies; the README says it has none."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/nuget/*.*nupkg
          if-no-files-found: error
