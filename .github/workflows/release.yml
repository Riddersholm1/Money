name: Release

# Publishing happens exactly one way: tag a commit, then publish a GitHub Release for that tag.
#
# There is deliberately no `push: tags:` trigger and no `workflow_dispatch`. A tag push is a cheap,
# easy-to-mistype action, and this workflow sends a package to nuget.org that can never be deleted —
# only unlisted. Requiring a published Release puts a human review step in front of that, and the
# Release page is also where the release notes get written.
#
# The version comes from the tag, so what ships cannot drift from what was tested.
on:
  release:
    types: [published]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build

      # A release must not ship something that cannot be AOT-published.
      - run: dotnet publish tests/Riddersholm.Money.AotTests -c Release -r linux-x64
      - run: ./artifacts/publish/Riddersholm.Money.AotTests/release_linux-x64/Riddersholm.Money.AotTests

  publish:
    name: Publish to NuGet
    needs: verify
    runs-on: ubuntu-latest

    # A second gate. Configure required reviewers on this environment and no package reaches
    # nuget.org without someone approving the run; the Trusted Publishing policy is bound to this
    # environment name as well, so a workflow outside it cannot mint a key.
    environment: nuget

    permissions:
      # Mints the short-lived OIDC token that NuGet/login exchanges for a temporary API key.
      # This is the whole reason there is no NUGET_API_KEY secret in this repository: a long-lived
      # push credential sitting in repository secrets is readable by every workflow and every action
      # they call, and it stays valid until someone remembers to rotate it. The key used below is
      # minted per run, expires in an hour, and is bound to this repository's immutable GitHub ID.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Resolve version from the release tag
        id: version
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"

          # Refuse rather than publish something unintended: an empty or malformed tag would
          # otherwise pack as 1.0.0 from Directory.Build.props and ship under the wrong version.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Release tag '$tag' is not a version. Expected v<major>.<minor>.<patch>[-prerelease], e.g. v1.0.0-rc.1."
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: dotnet pack -c Release -o ./artifacts/nuget -p:Version=${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/nuget/*.*nupkg
          if-no-files-found: error

      - name: Exchange the OIDC token for a temporary NuGet key
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # --skip-duplicate makes a re-run after a partial failure safe rather than fatal: three
      # packages are pushed, and a network error between the first and the third should not leave
      # the release unfinishable.
      - name: Push
        run: >
          dotnet nuget push "./artifacts/nuget/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --skip-duplicate
